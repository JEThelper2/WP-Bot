[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpbot-shared-contract"
version = "1.1.0"
description = "Shared intent/result contract between Track A (WhatsApp) and Track B (WordPress) for WP-Bot."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jsonschema>=4.18",
]

[project.optional-dependencies]
logging = [
    # Optional: enables JSON log output when JSON_LOGS=true
    "python-json-logger>=2.0",
]

[tool.setuptools.packages.find]
include = ["shared_contract*"]
