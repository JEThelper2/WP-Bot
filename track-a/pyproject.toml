[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpbot-track-a"
version = "0.1.0"
description = "WP-Bot Track A: WhatsApp Cloud API conversation service (inbound webhook receiver)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wpbot-shared-contract>=1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
transcribe = [
    # Pinned combo verified working on Windows/CPU (Aug 2026):
    # - ctranslate2 4.7.0's Windows wheel is broken (hard-errors on a
    #   missing ROCm dll dir); 4.8.x segfaults at model load on some hosts.
    # - onnxruntime fails to load on some Windows hosts, so VAD is off by
    #   default (Whisper's own no_speech_prob still drives is_voice).
    "faster-whisper==1.0.3",
    "ctranslate2==4.6.0",
    "setuptools<81",  # ctranslate2 4.6.0 imports pkg_resources on Windows
]
llm = [
    "openai>=1.30",
]

[tool.setuptools.packages.find]
include = ["track_a*"]
