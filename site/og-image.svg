<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0B1220"/>
      <stop offset="100%" style="stop-color:#1a2332"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D9488"/>
      <stop offset="100%" style="stop-color:#2DD4BF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="#0D9488" opacity="0.08"/>
  <circle cx="150" cy="530" r="150" fill="#2DD4BF" opacity="0.06"/>
  <!-- Paw icon -->
  <g transform="translate(530, 140)" fill="#2DD4BF">
    <!-- Main pad -->
    <ellipse cx="70" cy="110" rx="50" ry="40"/>
    <!-- Top left toe -->
    <ellipse cx="20" cy="50" rx="22" ry="28" transform="rotate(-15, 20, 50)"/>
    <!-- Top right toe -->
    <ellipse cx="120" cy="50" rx="22" ry="28" transform="rotate(15, 120, 50)"/>
    <!-- Middle left toe -->
    <ellipse cx="45" cy="30" rx="20" ry="26"/>
    <!-- Middle right toe -->
    <ellipse cx="95" cy="30" rx="20" ry="26"/>
  </g>
  <!-- Brand name -->
  <text x="600" y="330" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="72" font-weight="700" fill="white" letter-spacing="-1">Sitepaw</text>
  <!-- Tagline -->
  <text x="600" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="28" fill="#94a3b8">Update your website by sending a message</text>
  <!-- Accent line -->
  <rect x="480" y="420" width="240" height="3" rx="1.5" fill="url(#accent)"/>
  <!-- Feature pills -->
  <g transform="translate(260, 460)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#0D9488" opacity="0.15"/>
    <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#2DD4BF" font-weight="500">WhatsApp</text>
  </g>
  <g transform="translate(470, 460)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#0D9488" opacity="0.15"/>
    <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#2DD4BF" font-weight="500">No Code Needed</text>
  </g>
  <g transform="translate(680, 460)">
    <rect x="0" y="0" width="180" height="40" rx="20" fill="#0D9488" opacity="0.15"/>
    <text x="90" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" fill="#2DD4BF" font-weight="500">Instant Updates</text>
  </g>
</svg>
