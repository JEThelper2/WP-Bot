[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wpbot-track-b"
version = "0.1.0"
description = "WP-Bot Track B: WordPress site/state service (currently a stub)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "wpbot-shared-contract>=1.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "cryptography>=42",
    "redis>=5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "fakeredis>=2.20",
]

[tool.setuptools.packages.find]
include = ["track_b*"]
