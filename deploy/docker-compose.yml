# WP-Bot pilot stack: Track A (WhatsApp conversation), Track B (WordPress
# site/state), Redis, and Postgres — plus a WordPress sandbox so the
# Docker-gated integration suites run against a REAL WordPress install.
#
# Requires Docker Compose v2.20+ (depends_on with health conditions and
# service_completed_successfully).
#
#   cp deploy/.env.example deploy/.env   # optional: WhatsApp/OpenAI keys
#   docker compose -f deploy/docker-compose.yml up -d
#       -> Track A on http://localhost:8000, Track B on :8200,
#          WordPress sandbox on :8090
#
#   docker compose -f deploy/docker-compose.yml --profile test run --rm test
#       -> the FULL test suite (unit + integration), with the gated
#          WordPress/Postgres suites running for real.
#
# Shortcuts: `make up`, `make test`, `make logs`, `make down`.
name: wpbot

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wpbot
      POSTGRES_PASSWORD: wpbot
      POSTGRES_DB: wpbot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wpbot -d wpbot"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  # ------------------------------------------------------- WordPress sandbox
  wordpress-db:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
    volumes:
      - wordpress_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  wordpress:
    image: wordpress:6-php8.2
    depends_on:
      wordpress-db:
        condition: service_healthy
    ports:
      - "8090:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      # The mu-plugin that exposes the business-info REST route (Editor-
      # safe updates; see the Track B README security guardrail).
      - ../track-b/wp-sandbox/mu-plugins:/var/www/html/wp-content/mu-plugins

  wordpress-setup:
    image: wordpress:cli-php8.2
    depends_on:
      wordpress:
        condition: service_started
    environment:
      # Matches WPBOT_WP_TEST_URL in the test service, so the sandbox's
      # generated links line up with what the integration tests assert.
      WP_URL: http://wordpress
    volumes:
      - wordpress_data:/var/www/html
      - ../track-b/wp-sandbox/setup.sh:/setup.sh:ro
      - wpbot_wp_output:/shared
    entrypoint: ["/bin/sh", "/setup.sh"]

  # ------------------------------------------------------------- Track B
  track-b:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.track-b
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      WPBOT_REDIS_URL: redis://redis:6379/0
      WPBOT_PG_DSN: postgres://wpbot:wpbot@postgres:5432/wpbot
      WPBOT_SECRETS_KEY: ${WPBOT_SECRETS_KEY:-}
      WPBOT_TRACK_B_DB: /data/trackb.db
    ports:
      - "8200:8200"
    volumes:
      - trackb_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------- Track A
  track-a:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.track-a
    depends_on:
      track-b:
        condition: service_healthy
    environment:
      TRACK_B_URL: http://track-b:8200
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-wp-bot-dev-verify-token}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_GRAPH_API_VERSION: ${WHATSAPP_GRAPH_API_VERSION:-v21.0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      WP_BOT_TRACK_A_DB: /data/inbound.db
    ports:
      - "8000:8000"
    volumes:
      - tracka_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ------------------------------------------------------------- tests
  # Runs the full suite inside the stack. The WordPress-gated suites get
  # the sandbox URL + application password (written by wordpress-setup to
  # the shared wpbot_wp_output volume); the Postgres suite gets the stack
  # Postgres. Not started by plain `up` (profile).
  test:
    profiles: ["test"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    depends_on:
      wordpress-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      WPBOT_WP_TEST_URL: http://wordpress
      WPBOT_WP_TEST_USERNAME: editor
      WPBOT_PG_TEST_URL: postgres://wpbot:wpbot@postgres:5432/wpbot
    volumes:
      - wpbot_wp_output:/app/track-b/wp-sandbox/_output

volumes:
  pg_data:
  wordpress_db_data:
  wordpress_data:
  wpbot_wp_output:
  tracka_data:
  trackb_data:
